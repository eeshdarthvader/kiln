<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Kiln block diagram">
  <style>
text{font-family:-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif}
.node rect{fill:#121622;stroke:#323b55;stroke-width:1.5;rx:12}
.node text{fill:#e8ebf5;font-size:14px;font-weight:600;text-anchor:middle}
.node .s{fill:#8089a3;font-size:11px;font-weight:400}
.lane{fill:#ffffff06;stroke:#323b55;stroke-width:1.5;rx:16}
.lane.cp{fill:#ff6a3d0d;stroke:#ff6a3d99;stroke-width:2}
.lane.rt{fill:#5cc8ff0d;stroke:#5cc8ff99;stroke-width:2}
.lane-t{fill:#8089a3;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.lane-t.cp{fill:#ff8a5c}.lane-t.rt{fill:#5cc8ff}
.edge{fill:none;stroke:#46506d;stroke-width:1.5}
.dot{fill:#ffb347}
</style><rect width="960" height="470" rx="18" fill="#0a0c12"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#46506d"/></marker></defs>
  <rect class="lane" x="10" y="10" width="170" height="450"/><text class="lane-t" x="26" y="34">Intake</text>
  <rect class="lane cp" x="200" y="10" width="400" height="450"/><text class="lane-t cp" x="216" y="34">Control plane</text>
  <rect class="lane rt" x="620" y="10" width="330" height="385"/><text class="lane-t rt" x="636" y="34">Runtime</text>
  <g id="edges">
    <path class="edge" marker-end="url(#a)" d="M170 95H240"/>
    <path class="edge" d="M170 215H215V95"/>
    <path class="edge" d="M170 335H215V215"/>
    <path class="edge" marker-end="url(#a)" d="M400 95H430V215H470"/>
    <path class="edge" marker-end="url(#a)" d="M470 225H400"/>
    <path class="edge" marker-end="url(#a)" d="M580 215H650"/>
    <path class="edge" marker-end="url(#a)" d="M790 245V300"/>
    <path class="edge" marker-end="url(#a)" d="M930 340H945V95H930"/>
    <path class="edge" marker-end="url(#a)" d="M650 95H525V180"/>
    <path class="edge" marker-end="url(#a)" d="M525 250V340H480"/>
    <path class="edge" marker-end="url(#a)" d="M790 380V415"/>
    <path class="edge" marker-end="url(#a)" d="M360 380V435H640"/>
  </g>
  <g class="node"><rect x="30" y="60" width="140" height="70"/><text x="100" y="93">GitHub issues</text><text class="s" x="100" y="112">label: factory</text></g>
  <g class="node"><rect x="30" y="180" width="140" height="70"/><text x="100" y="213">Task providers</text><text class="s" x="100" y="232">Jira, any tracker</text></g>
  <g class="node"><rect x="30" y="300" width="140" height="70"/><text x="100" y="333">Paste a URL</text><text class="s" x="100" y="352">from the dashboard</text></g>
  <g class="node"><rect x="240" y="60" width="160" height="70"/><text x="320" y="93">Intake</text><text class="s" x="320" y="112">poll and dedupe</text></g>
  <g class="node"><rect x="470" y="180" width="110" height="70"/><text x="525" y="211">Pipeline</text><text class="s" x="525" y="230">engine</text></g>
  <g class="node"><rect x="240" y="300" width="240" height="80"/><text x="360" y="333">Autonomy policy</text><text class="s" x="360" y="352">L0 to L3, rules from the base branch</text></g>
  <g class="node"><rect x="240" y="180" width="160" height="70"/><text x="320" y="211">Run store</text><text class="s" x="320" y="230">JSON on disk</text></g>
  <g class="node"><rect x="650" y="180" width="280" height="65"/><text x="790" y="210">Herdr session</text><text class="s" x="790" y="228">worktree, one tab per stage</text></g>
  <g class="node"><rect x="650" y="300" width="280" height="80"/><text x="790" y="333">Claude Code agent</text><text class="s" x="790" y="352">in a Docker container</text></g>
  <g class="node"><rect x="650" y="60" width="280" height="70"/><text x="790" y="93">Reporting MCP</text><text class="s" x="790" y="112">agents call report_status</text></g>
  <g class="node"><rect x="640" y="415" width="300" height="40"/><text x="790" y="440">Pull request</text></g>

  <circle class="dot" r="4"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M170 95H240"/></circle>
  <circle class="dot" r="4"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M170 335H215V95H240"/></circle>
  <circle class="dot" r="4"><animateMotion dur="2.2s" begin="0.8s" repeatCount="indefinite" path="M400 95H430V215H470"/></circle>
  <circle class="dot" r="4"><animateMotion dur="1.4s" begin="1.2s" repeatCount="indefinite" path="M580 215H650"/></circle>
  <circle class="dot" r="4"><animateMotion dur="1.4s" begin="1.6s" repeatCount="indefinite" path="M790 245V300"/></circle>
  <circle class="dot" r="4"><animateMotion dur="2.4s" begin="0.2s" repeatCount="indefinite" path="M930 340H945V95H930"/></circle>
  <circle class="dot" r="4"><animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite" path="M650 95H525V180"/></circle>
  <circle class="dot" r="4"><animateMotion dur="1.4s" begin="0.6s" repeatCount="indefinite" path="M790 380V415"/></circle>
</svg>