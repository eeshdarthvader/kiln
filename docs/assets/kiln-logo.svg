<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 48 48" role="img" aria-label="Kiln">
  <style>
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 2.4s ease-in-out infinite; }
    .core { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.7s ease-in-out infinite reverse; }
    .arch { stroke-dasharray: 60; animation: draw 1.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes flicker {
      0%, 100% { transform: scale(1, 1) rotate(0); }
      25% { transform: scale(0.94, 1.06) rotate(-2deg); }
      50% { transform: scale(1.04, 0.96) rotate(1.5deg); }
      75% { transform: scale(0.97, 1.04) rotate(-1deg); }
    }
    @keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .flame, .core, .arch { animation: none; } }
  </style>
  <defs>
    <linearGradient id="kiln-ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.55" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ff2e7e"/>
    </linearGradient>
    <linearGradient id="kiln-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2233"/>
      <stop offset="1" stop-color="#10131d"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#kiln-body)"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="none" stroke="url(#kiln-ember)" stroke-opacity="0.55"/>
  <path class="arch" d="M12 38V23a12 12 0 0 1 24 0v15" fill="none" stroke="url(#kiln-ember)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M9.5 38h29" stroke="url(#kiln-ember)" stroke-width="2.6" stroke-linecap="round"/>
  <path class="flame" d="M24 34.5c-4.2 0-6.6-2.8-6.6-6.2 0-3 2-4.6 3.2-7 .5 1.6 1.4 2.4 2.4 2.9-.2-3.2 1-6 3.4-8 .1 3.4 3.8 5 3.8 10.1 0 3.6-2.5 8.2-6.2 8.2Z" fill="url(#kiln-ember)"/>
  <path class="core" d="M24 34.5c-1.9 0-3.1-1.4-3.1-3.1 0-1.6 1.3-2.4 1.9-3.8.9.9 1.7 1.8 1.7 3.1.5-.4.9-1 1-1.8.5.7.6 1.4.6 2 0 1.9-1.1 3.6-2.1 3.6Z" fill="#fff3d6"/>
</svg>
